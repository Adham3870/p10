name: React Practical 10

on:
  push:
  pull_request:

jobs:

  autograding:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Packages
        run: npm install

      - name: Build React Project
        run: npm run build

      - name: Run Test Cases
        run: npm run testcase
